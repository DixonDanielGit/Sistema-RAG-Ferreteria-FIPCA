services:
  db:
    # Version fijada: misma imagen que genero el esquema actual (pgvector 0.8.7).
    image: pgvector/pgvector:0.8.7-pg16
    container_name: postgres_ferreteria
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Contrasena del rol de aplicacion; init.sql la exige para crearlo.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      # Solo accesible desde el equipo local. En un VPS cambia BIND_ADDRESS
      # a 0.0.0.0 y protege el puerto con el firewall.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Solo se ejecuta al crear el volumen por primera vez.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: pgadmin_ferreteria
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      # La imagen escucha en 8080 cuando detecta un contexto restringido.
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_HOST_PORT}:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/misc/ping', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
