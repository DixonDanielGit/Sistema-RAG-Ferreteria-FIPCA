<header class="fipca-nav">
  {% set url_marca = '/dashboard' %}
  {% include "_marca.html" %}

  <button class="fipca-nav__menu" id="fipca-menu-toggle" type="button"
          aria-expanded="false" aria-controls="fipca-menu-enlaces"
          aria-label="Abrir navegación" title="Abrir navegación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" aria-hidden="true">
    <path class="fipca-nav__linea-menu fipca-nav__linea-menu--arriba" d="M4 7h16" />
    <path class="fipca-nav__linea-menu fipca-nav__linea-menu--medio" d="M4 12h16" />
    <path class="fipca-nav__linea-menu fipca-nav__linea-menu--abajo" d="M4 17h16" />
  </svg>
  </button>

  <nav class="fipca-nav__enlaces" id="fipca-menu-enlaces"
       aria-label="Navegación principal">
    <a class="fipca-nav__enlace" href="/dashboard"
       {% if activo == 'dashboard' %}aria-current="page"{% endif %}>Panel</a>
    <a class="fipca-nav__enlace" href="/chat"
       {% if activo == 'chat' %}aria-current="page"{% endif %}>Asistente</a>
    {% if usuario and usuario.rol == 'admin' %}
    <a class="fipca-nav__enlace" href="/usuarios"
       {% if activo == 'usuarios' %}aria-current="page"{% endif %}>Usuarios</a>
    <a class="fipca-nav__enlace fipca-nav__enlace--api" href="/docs" rel="noopener">API</a>
    {% endif %}
    <a class="fipca-nav__enlace" href="/perfil"
       {% if activo == 'perfil' %}aria-current="page"{% endif %}>Perfil</a>
    <a class="fipca-nav__enlace" href="/configuracion"
       {% if activo == 'configuracion' %}aria-current="page"{% endif %}>Configuración</a>
  </nav>

  <div class="fipca-nav__usuario">
    <strong>{{ usuario.nombre }} {{ usuario.apellido }}</strong>
    <span>{{ 'Administrador' if usuario.rol == 'admin' else 'Ventas' }}</span>
  </div>

  <button class="fipca-tema" type="button" data-tema-toggle
          aria-label="Cambiar entre modo claro y oscuro" title="Cambiar tema">
    <svg class="fipca-tema__sol" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <svg class="fipca-tema__luna" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
    </svg>
  </button>

  <button class="fipca-nav__salir" type="button" data-cerrar-sesion
          aria-label="Cerrar sesión" title="Cerrar sesión">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 17l5-5-5-5M15 12H3" />
      <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
    </svg>
  </button>
</header>
